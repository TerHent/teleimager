# Custom camera configuration for testing the RealSense head camera
head_camera:
  enable_zmq: true
  zmq_port: 55555
  enable_webrtc: false   # Disable WebRTC on the robot side
  webrtc_port: 60001
  webrtc_codec: h264
  type: realsense
  image_shape: [480, 640]
  binocular: false
  fps: 30
  serial_number: "246322302117"

# Add dummy configurations for wrist cameras to prevent KeyError in ImageClient
left_wrist_camera:
  enable_zmq: false
  zmq_port : 55556
  enable_webrtc: false
  webrtc_port : 60002
  webrtc_codec: h264
  type: uvc
  image_shape: [480, 640]
